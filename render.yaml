# ==============================================================================
# LOGICWHILELIRE — Render Infrastructure as Code Blueprint
# Defines separate Production and Staging backend services
# ==============================================================================
services:
  # ——————————————————————————————————————————
  # 1. PRODUCTION BACKEND SERVICE
  # ——————————————————————————————————————————
  - type: web
    name: LogicWhileLiRE-api
    runtime: node
    plan: starter
    region: oregon
    branch: main
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: VIOLATION_THRESHOLD
        value: 2
      - key: JWT_EXPIRY
        value: 3h
      - key: OTP_EXPIRY_MINUTES
        value: 5
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://logicwhilequiz.com or https://your-app.netlify.app
      - key: FRONTEND_URL
        sync: false # e.g. https://your-app.netlify.app — used in email links and password-reset URLs
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true # 32+ char random key for AES-256-CTR encryption of TOTP secrets at rest
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false # Primary email transport — Resend HTTPS API key
      - key: EMAIL_DAILY_CAP
        value: "100" # Free-tier safeguard cap (warn at 80%, block at 100%)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: DEMO_MODE
        value: "false"
      - key: SESSION_SECRET
        generateValue: true
      - key: MAIL_DOMAIN
        sync: false # e.g. yourdomain.com — used to build noreply@ and alias lookups
      - key: EMAIL_FROM
        sync: false # e.g. noreply@yourdomain.com
      - key: EMAIL_FROM_NAME
        sync: false # e.g. LogicWhileLiRE
      - key: OTP_FROM_EMAIL
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false # Destination for proctoring violations & critical alerts
      - key: ADMIN_EMAIL
        sync: false # Admin email for proctoring monitor notifications
      - key: SUPPORT_EMAIL
        sync: false # Support contact email displayed in email footers
      - key: INSPECTOR_ALERT_EMAIL
        sync: false # Email for proctoring inspector alerts
      - key: STUDENT_JWT_EXPIRY
        value: "4h"
      - key: BACKUP_DIR
        value: /var/backups/logicwhilelire # Must be absolute path outside the repo
      - key: BREVO_SMTP_USER
        sync: false # Brevo fallback — login email (optional)
      - key: BREVO_SMTP_PASS
        sync: false # Brevo fallback — SMTP key starting with xsmtp...
      - key: BREVO_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_API_KEY
        sync: false
      - key: SLOW_QUERY_THRESHOLD_MS
        value: "500"


  # ——————————————————————————————————————————
  # 2. STAGING BACKEND SERVICE
  # ——————————————————————————————————————————
  - type: web
    name: logicwhile-quiz-server-staging
    runtime: node
    plan: starter
    region: oregon
    branch: staging
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: staging
      - key: PORT
        value: 3001
      - key: DEMO_MODE
        value: "false"
      - key: VIOLATION_THRESHOLD
        value: 2
      - key: JWT_EXPIRY
        value: 3h
      - key: OTP_EXPIRY_MINUTES
        value: 5
      - key: CLIENT_ORIGIN
        sync: false # e.g. https://staging--your-app.netlify.app
      - key: FRONTEND_URL
        sync: false # Staging frontend URL
      - key: SUPABASE_URL
        sync: false # Staging Supabase project URL
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false # Staging Supabase service role key
      - key: SUPABASE_ANON_KEY
        sync: false # Staging Supabase anon key
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TOTP_ENCRYPTION_KEY
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD_HASH
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_DAILY_CAP
        value: "50"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_DOMAIN
        sync: false # e.g. yourdomain.com
      - key: EMAIL_FROM
        sync: false # e.g. noreply@yourdomain.com
      - key: EMAIL_FROM_NAME
        sync: false # e.g. LogicWhileLiRE (Staging)
      - key: OTP_FROM_EMAIL
        sync: false
      - key: ADMIN_ALERT_EMAIL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: INSPECTOR_ALERT_EMAIL
        sync: false
      - key: STUDENT_JWT_EXPIRY
        value: "4h"
      - key: BACKUP_DIR
        value: /var/backups/logicwhilelire-staging
      - key: BREVO_SMTP_USER
        sync: false
      - key: BREVO_SMTP_PASS
        sync: false
      - key: BREVO_SMTP_HOST
        value: smtp-relay.brevo.com
      - key: BREVO_SMTP_PORT
        value: "587"
      - key: BREVO_API_KEY
        sync: false
      - key: SLOW_QUERY_THRESHOLD_MS
        value: "500"

