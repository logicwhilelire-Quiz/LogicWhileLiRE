name: CI Pipeline

on:
  push:
    branches: [ main, master, staging, preview ]
  pull_request:
    branches: [ main, master, staging, preview ]

jobs:
  server-ci:
    name: Server Build, Unit Tests & Smoke Verification
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './server/package-lock.json'

      - name: Install Server Dependencies
        run: npm ci

      - name: TypeScript Build
        run: npm run build

      - name: Run Server Unit & Security Test Suites
        run: npm test
        env:
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: mock-key
          SUPABASE_ANON_KEY: mock-anon-key
          JWT_SECRET: test-secret-mock-jwt-key-2026-xyz
          ADMIN_JWT_SECRET: test-admin-jwt-key-2026-abc
          NODE_ENV: test
          TEST_MOCK_ONLY: 'true'

      - name: Launch Server & Run Smoke Verification
        run: |
          node dist/index.js &
          SERVER_PID=$!
          echo "Waiting for server to become healthy..."
          for i in $(seq 1 30); do
            if curl -s http://localhost:3001/api/health > /dev/null; then
              echo "Server is healthy after ${i}s"
              break
            fi
            sleep 1
          done
          node test-smoke.js
          kill $SERVER_PID
        env:
          PORT: 3001
          SUPABASE_URL: https://mock.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: mock-key
          SUPABASE_ANON_KEY: mock-anon-key
          JWT_SECRET: test-secret-mock-jwt-key-2026-xyz
          ADMIN_JWT_SECRET: test-admin-jwt-key-2026-abc
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD_HASH: $2b$12$MwHGNgeHppSpLHgWF61EqOv.ih06YQ4VyXrw1BewRY6NdFhSkQMkS
          CLIENT_ORIGIN: http://localhost:5173
          NODE_ENV: test
          TEST_MOCK_ONLY: 'true'

  client-ci:
    name: Client Lint, Type Check & Production Bundle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './client/package-lock.json'

      - name: Install Client Dependencies
        run: npm ci

      - name: Run Code Linter (oxlint)
        run: npm run lint

      - name: Type Check & Production Build
        run: npm run build
