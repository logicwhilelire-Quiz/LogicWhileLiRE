# ==============================================================================
# LOGICWHILELIRE — Netlify Production & Staging Deployment Config
# ==============================================================================

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

# Proxy backend API requests seamlessly to Render (eliminates CORS hurdles & Cloudflare edge blocks)
[[redirects]]
  from = "/api/*"
  to = "https://logicwhilelire-api.onrender.com/api/:splat"
  status = 200
  force = false

# Ensure missing assets return 404 status code instead of falling back to HTML
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404
  force = false

# Default SPA Fallback: Route all incoming paths to index.html with 200 status
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ——————————————————————————————————————————
# ENVIRONMENT CONTEXTS
# ——————————————————————————————————————————

# Production Context (main branch)
[context.production.environment]
  NODE_ENV = "production"

# Staging Branch Context (staging branch -> staging--your-site.netlify.app)
[context.staging]
  command = "npm run build"
[context.staging.environment]
  NODE_ENV = "staging"

# Deploy Previews (Pull Requests)
[context.deploy-preview]
  command = "npm run build"
[context.deploy-preview.environment]
  NODE_ENV = "preview"
