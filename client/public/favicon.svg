<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Emblem Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Hex-Square with Subtle Bevel -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Inner Ambient Aura -->
  <circle cx="32" cy="32" r="22" fill="#f59e0b" opacity="0.15" filter="url(#glow)" />

  <!-- LogicWhile Tech Emblem / Shield Geometry -->
  <!-- Stylized "L" & "W" LogicWhile Code Chevron Geometry -->
  <g filter="url(#glow)">
    <!-- Left Terminal / Chevron (L) -->
    <path d="M 21 20 L 21 44 L 30 44" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Right Tech Bracket / Quiz Spark -->
    <path d="M 33 24 L 39 36 L 44 26 L 49 42" fill="none" stroke="url(#borderGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Accent Product Diamond (Quiz spark) -->
  <circle cx="49" cy="22" r="2.8" fill="#fbbf24" filter="url(#glow)" />
</svg>
