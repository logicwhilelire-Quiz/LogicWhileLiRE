<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient (IARE Deep Aeronautical Night) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190F3B" />
      <stop offset="60%" stop-color="#0C0720" />
      <stop offset="100%" stop-color="#060312" />
    </linearGradient>

    <!-- Border Ring Gradient (IARE Signature Gold) -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf9f62" />
      <stop offset="50%" stop-color="#e5c386" />
      <stop offset="100%" stop-color="#a28b40" />
    </linearGradient>

    <!-- GROWTHRAN Loop Gradient -->
    <linearGradient id="growthranCoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bf9f62" />
      <stop offset="50%" stop-color="#064484" />
      <stop offset="100%" stop-color="#e5c386" />
    </linearGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Hex-Square with Gold Border -->
  <rect x="3" y="3" width="58" height="58" rx="14" fill="url(#bgGrad)" stroke="url(#goldBorder)" stroke-width="2.2" />

  <!-- Ambient Gold Halo -->
  <circle cx="32" cy="32" r="20" fill="#bf9f62" opacity="0.12" filter="url(#subtleGlow)" />

  <!-- GROWTHRAN Signature Algorithmic Precision Loop -->
  <g filter="url(#subtleGlow)">
    <path
      d="M 32,16 C 22,16 17,22 17,30 C 17,38 23,46 32,46 C 41,46 47,38 47,30 C 47,20 37,18 32,18 C 25,18 22,25 22,30 C 22,35 27,40 32,40 C 37,40 42,35 42,30 C 42,24 37,22 32,22"
      fill="none"
      stroke="url(#growthranCoil)"
      stroke-width="3.2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Growth Focus Node -->
    <circle cx="32" cy="30" r="3.2" fill="#bf9f62" />
  </g>
</svg>
