<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD54F" />
      <stop offset="100%" stop-color="#FFB400" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#0A1224"/>
  
  <!-- Outer Circuit Line -->
  <path d="M 8 36 L 8 10 L 56 10 L 56 22 L 52 22" stroke="url(#favGold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="8" cy="36" r="2.5" fill="#FFB400" />
  
  <path d="M 8 54 L 56 54 L 56 34" stroke="url(#favGold)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="56" cy="34" r="2.5" fill="#FFB400" />

  <!-- Bulb with Ray -->
  <circle cx="52" cy="22" r="3" fill="#FFB400" />
  <line x1="48" y1="22" x2="42" y2="22" stroke="#FFD54F" stroke-width="1.2" stroke-linecap="round"/>

  <!-- '0' (Cyan) & '1' (Orange) -->
  <g transform="translate(1, -2)">
    <!-- 0 -->
    <ellipse cx="22" cy="28" rx="6" ry="8" fill="none" stroke="#38BDF8" stroke-width="2.2" />
    <line x1="17" y1="34" x2="27" y2="22" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" />
    <!-- 1 -->
    <path d="M 33 24 L 37 20 L 37 36 M 34 36 L 40 36" stroke="#FF7A00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- LiRE box -->
  <rect x="14" y="40" width="36" height="10" rx="2" stroke="url(#favGold)" stroke-width="1.2" fill="rgba(56, 189, 248, 0.15)"/>
  <text x="32" y="48" text-anchor="middle" font-family="'Space Grotesk', sans-serif" font-size="6.5" font-weight="900" letter-spacing="0.08em" fill="#FFFFFF">
    <tspan fill="#38BDF8">L</tspan><tspan fill="#FF7A00">R</tspan><tspan fill="#38BDF8">E</tspan>
  </text>
</svg>