# ==============================================================================
# LogicWhileLiRE — Netlify Production Deployment Config
# ==============================================================================

[build]
  base = "client"
  publish = "dist"
  command = "npm run build"

# Proxy backend API requests seamlessly to Render (eliminates CORS hurdles & Cloudflare edge blocks)
[[redirects]]
  from = "/api/*"
  to = "https://logicwhilelire-api.onrender.com/api/:splat"
  status = 200
  force = false

# SPA Fallback: Route all non-asset paths to index.html with 200 status
# NOTE: Assets (JS/CSS/images) must NOT be caught here — Netlify serves them directly from dist/
# The old /assets/* -> 404 redirect was INCORRECTLY blocking lazy-loaded JS chunks (e.g. StudentControl-*.js)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and cache headers for all routes
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), display-capture=(self)"

# index.html must NEVER be cached so deployments are picked up immediately
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Service worker must never be stale
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Hashed assets (JS/CSS chunks) are immutable — safe to cache for 1 year
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
